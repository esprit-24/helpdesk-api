services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile

    image: helpdesk-api:dev

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:17

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
